# /etc/l8tunnel/server.yaml
#
# DNS: point tunnel.example.com and *.tunnel.example.com at the relay.
# The certificate must cover connect.tunnel.example.com and
# *.tunnel.example.com (a wildcard for *.tunnel.example.com covers both).

base_domain: tunnel.example.com
# control_sni: connect.tunnel.example.com   # default: connect.<base_domain>
# public_host: tunnel.example.com           # default: base_domain (mode A addresses)
# reserved_names: [www]                     # names no tunnel may take (e.g. a website hosted elsewhere)

listen:
  https: ":443"          # agents + every tunnel's SNI traffic
  http: ":80"            # redirects to HTTPS; "off" disables it

# public_https_port: 443  # if clients reach listen.https through a port forward
# forwarded_headers: true # add X-Forwarded-For/-Host/-Proto to http tunnel requests

# bind: ""                # address tunnel ports bind to; default all interfaces
tcp_port_range: "22000-22999"   # mode A: one public port per TCP/SSH tunnel

# Certificates: set exactly one of tls (your own files) or acme.
tls:
  cert: /etc/l8tunnel/tls/fullchain.pem
  key: /etc/l8tunnel/tls/privkey.pem

# acme:
#   # dns01: one wildcard certificate for *.tunnel.example.com through your DNS
#   # provider's API (recommended). http01: a certificate per tunnel host through
#   # port 80, requested when a tunnel is first reached (Let's Encrypt limits
#   # these to 50 new names per week per registered domain).
#   mode: dns01
#   email: admin@example.com
#   dns_provider: cloudflare               # supported: cloudflare
#   dns_credentials:
#     api_token: ${CF_API_TOKEN}           # Zone:Read + DNS:Edit on the zone
#   # storage: /var/lib/l8tunnel/acme      # accounts and certificates
#   # ca: https://acme-staging-v02.api.letsencrypt.org/directory   # for testing

# Tokens and permanent reservations live in <storage>/l8tunnel.db; manage
# them on the running relay (as root or the l8tunnel user):
#   l8tunnel-server token create --name laptop [--names 'dev-*'] [--types http,ssh]
#   l8tunnel-server reservation add --name homebox --token laptop --port 22001
#   l8tunnel-server status
# storage: /var/lib/l8tunnel
# admin:
#   socket: /run/l8tunnel/admin.sock

# log:
#   format: text                     # or json
#   level: info                      # debug, info, warn, error
# access_log: false                  # one line per HTTP tunnel request
# metrics:
#   listen: 127.0.0.1:9100           # /metrics (Prometheus), /healthz and /readyz; empty disables

# trusted_proxies:                   # PROXY protocol headers are believed only from these
#   - 10.0.0.0/8                     # (an edge proxy or load balancer in front of the relay);
#                                    # client IPs then come from the header

# ssh_gateway:                       # ssh -J gw@tunnel.example.com:2222 user@<tunnel>
#   listen: ":2222"
#   # host_key: /var/lib/l8tunnel/gateway_host_key   # generated on first start
#   # users: l8tunnel-server gateway-key add --name alice --key-file alice.pub --tunnels 'home*'

# oidc:                              # "sign in with ..." for http tunnels
#   # auth_host: auth.tunnel.example.com   # default auth.<base_domain>; register
#   #                                      # https://<auth_host>/callback at the provider
#   # session_ttl: 12h
#   providers:
#     google:
#       issuer: https://accounts.google.com
#       client_id: 1234.apps.googleusercontent.com
#       client_secret: ${GOOGLE_CLIENT_SECRET}

# rate_limits:                       # per client IP
#   connections_per_second: 20
#   connections_burst: 100
#   auth_failures_per_minute: 5      # bad agent/access tokens before refusing

# heartbeat_interval: 15s   # agents ping this often; dropped after 3 misses
# name_grace_period: 5m     # names/ports stay reserved for the token after a disconnect
