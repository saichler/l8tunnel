# /etc/l8tunnel/agent.yaml

relay: connect.tunnel.example.com:443
# server_name: connect.tunnel.example.com   # default: host of relay
# ca: /etc/l8tunnel/ca.pem                  # default: system roots

# ${VAR} is read from the environment; leaving token out uses $L8TUNNEL_TOKEN.
token: ${L8TUNNEL_TOKEN}
# Or (or also) a client certificate from: l8tunnel-server agent-cert issue --token T --out PREFIX
# cert: /etc/l8tunnel/agent.crt
# key: /etc/l8tunnel/agent.key

# Serves "l8tunnel-agent status" (connection state, tunnels, traffic).
status_socket: /run/l8tunnel-agent/status.sock

# transport: tls          # or wss: WebSocket over TLS, for networks that only allow HTTP(S)
# proxy: http://proxy.corp:3128   # default: HTTPS_PROXY / NO_PROXY; "none" disables
# log: {format: text, level: info}

tunnels:
  - name: homebox
    type: ssh                 # target defaults to 127.0.0.1:22
    public_port: 22001        # mode A; mode B is always homebox.tunnel.example.com
    allow_ips: [203.0.113.0/24]   # only these clients (mode A and B); deny_ips wins
  - name: backup
    type: ssh
    target: 192.168.1.40:22
    access_token: ${BACKUP_ACCESS_TOKEN}  # mode B only: l8tunnel connect --access-token
  - name: nas
    type: tcp
    target: 192.168.1.20:22   # any host the agent can reach
  - name: grafana
    type: http                # https://grafana.tunnel.example.com, TLS terminated at the relay
    target: 3000              # a bare port means 127.0.0.1:3000
    # domains: [grafana.example.com]   # CNAME'd to the relay; token needs --domains
    basic_auth:               # hashes from: l8tunnel hash-password
      - user: admin
        password_hash: "$2a$10$7EqJtq98hPqEX7fNZaFWoOhi5BWX4Z3Z6KqQo5nsgvs1R3.x2T6Ku"  # placeholder: use your own
  - name: homeassistant
    type: http
    target: https://192.168.1.30:8123   # the agent speaks TLS to the service
    insecure_skip_verify: true          # the service has a self-signed certificate
  - name: vault
    type: tls                 # passthrough: the relay never decrypts; the service holds
    target: 127.0.0.1:8200    # a certificate for vault.tunnel.example.com
