/*
 * l8tunnel control protocol.
 *
 * Every message on the control stream (the first mux stream the agent opens)
 * is a length-prefixed ControlMessage. Every data stream the relay opens
 * starts with a single length-prefixed StreamOpen, followed by raw bytes.
 */
syntax = "proto3";

package l8tunnel;

option go_package = "./types/l8tunnel";

enum TunnelType {
  TUNNEL_TYPE_UNSPECIFIED = 0;
  TUNNEL_TYPE_HTTP = 1; // TLS terminated at the relay, routed by Host header
  TUNNEL_TYPE_TLS = 2;  // TLS passthrough, routed by SNI
  TUNNEL_TYPE_TCP = 3;  // raw TCP on a dedicated public port
  TUNNEL_TYPE_SSH = 4;  // TCP preset, default local target :22
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNAUTHORIZED = 1;
  ERROR_CODE_UNSUPPORTED_VERSION = 2;
  ERROR_CODE_INVALID_REQUEST = 3;
  ERROR_CODE_UNSUPPORTED_TUNNEL_TYPE = 4;
  ERROR_CODE_NAME_TAKEN = 5;
  ERROR_CODE_PORT_NOT_ALLOWED = 6;
  ERROR_CODE_PORT_UNAVAILABLE = 7;
  ERROR_CODE_FORBIDDEN = 8; // the token's policy doesn't allow the request
}

message Hello {
  uint32 protocol_version = 1;
  string token = 2;
  string agent_id = 3;
  string agent_version = 4;
  string os = 5;
  string arch = 6;
}

message Welcome {
  string session_id = 1;
  int64 heartbeat_interval_ms = 2;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}

// TunnelSpec never carries the local target: the agent keeps the
// tunnel -> target mapping, so the relay can't make it dial anything else.
message TunnelSpec {
  string name = 1;
  TunnelType type = 2;
  uint32 public_port = 3; // TCP/SSH only; 0 = allocate from the relay's range
  AccessPolicy access = 4;
  repeated string domains = 5; // HTTP/TLS only: custom domains (CNAME to the relay)
}

// AccessPolicy restricts who can use a tunnel; the relay enforces it.
message AccessPolicy {
  repeated string allow_ips = 1;       // CIDRs or addresses; empty = everyone
  repeated string deny_ips = 2;        // CIDRs or addresses; deny wins
  repeated BasicUser basic_users = 3;  // HTTP tunnels only
  bytes access_token_sha256 = 4;       // TCP/SSH only: mode B clients must
                                       // present the token (no mode A port)
}

message BasicUser {
  string username = 1;
  string bcrypt_hash = 2;
}

message Register {
  repeated TunnelSpec tunnels = 1;
}

message Endpoint {
  string tunnel_id = 1;
  string name = 2;
  TunnelType type = 3;
  string public_address = 4; // mode A: <public_host>:<public_port>
  uint32 public_port = 5;
  string hostname = 6;       // mode B: TLS SNI host, <name>.<base_domain>
  repeated string domains = 7; // custom domains served by this tunnel
}

message Registered {
  repeated Endpoint endpoints = 1;
}

message Ping {
  uint64 nonce = 1;
  int64 sent_unix_nano = 2;
  int64 last_rtt_us = 3; // the agent's last measured round trip (metrics)
}

message Pong {
  uint64 nonce = 1;
  int64 sent_unix_nano = 2;
}

message ControlMessage {
  oneof body {
    Hello hello = 1;
    Welcome welcome = 2;
    Error error = 3;
    Register register = 4;
    Registered registered = 5;
    Ping ping = 6;
    Pong pong = 7;
  }
}

// ConnectAuth is sent by "l8tunnel connect" right after the TLS handshake
// when the relay negotiated the connect-token ALPN (mode B tunnels that
// require an access token).
message ConnectAuth {
  string access_token = 1;
}

// ConnectAuthResult is the relay's answer to ConnectAuth; tunnel data
// follows only when ok is true.
message ConnectAuthResult {
  bool ok = 1;
}

message StreamOpen {
  string tunnel_id = 1;
  string client_addr = 2;
}
