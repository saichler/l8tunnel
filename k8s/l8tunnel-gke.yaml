# GKE mode (K8sRules): per-node workloads are DaemonSets, the backend and
# registry single StatefulSets, the relays a Deployment of two, all on one
# shared persistent disk claim (l8tunnel-data) mounted at /data.
#
# The edge and the web UI run only on the node labeled
# l8tunnel.io/edge=true (k8s/label-edge.sh <node>): give that node a
# static external IP for the tunnel domain. Every process writes its logs
# under /data/logs/l8tunnel, a hostPath the log agent on each node
# collects.
apiVersion: v1
kind: Namespace
metadata:
  name: l8tunnel
  labels:
    name: l8tunnel

---

# Persistent disks for the shared data claim.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: l8tunnel-storage
provisioner: kubernetes.io/gce-pd
parameters:
  type: pd-standard
reclaimPolicy: Retain

---

# The data volume every l8tunnel process mounts at /data.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: l8tunnel
  name: l8tunnel-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: l8tunnel-storage
  resources:
    requests:
      storage: 20Gi

---

# cluster.yaml, shared by every l8tunnel process (plan §2, §16).
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: l8tunnel
  name: l8tunnel-cluster
  labels:
    app: l8tunnel
data:
  cluster.yaml: |
    base_domain: layer8-tunnel.info
    reserved_names: [www, admin]
    public:
      gateway: 2222
    agent_ca:
      cert: /etc/l8tunnel/agent-ca/ca.crt
      key: /etc/l8tunnel/agent-ca/ca.key
    # The GKE pod and node ranges (VPC-native); narrow these to your
    # cluster's CIDRs.
    trusted_proxies: [10.0.0.0/8]

---

# The vnet: the switch every l8tunnel vnic connects through.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  namespace: l8tunnel
  name: l8tunnel-vnet
  labels:
    app: l8tunnel-vnet
spec:
  selector:
    matchLabels:
      app: l8tunnel-vnet
  template:
    metadata:
      labels:
        app: l8tunnel-vnet
    spec:
      hostNetwork: true
      containers:
        - name: l8tunnel-vnet
          image: "saichler/l8tunnel-vnet:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 29000
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: hdata
              mountPath: /data
            - name: logs
              mountPath: /data/logs/l8tunnel
      volumes:
        - name: hdata
          persistentVolumeClaim:
            claimName: l8tunnel-data
        - name: logs
          hostPath:
            path: /var/log/l8tunnel
            type: DirectoryOrCreate

---

# The logs network: the log service System > Logs reads.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  namespace: l8tunnel
  name: l8tunnel-log-vnet
  labels:
    app: l8tunnel-log-vnet
spec:
  selector:
    matchLabels:
      app: l8tunnel-log-vnet
  template:
    metadata:
      labels:
        app: l8tunnel-log-vnet
    spec:
      hostNetwork: true
      containers:
        - name: l8tunnel-log-vnet
          image: "saichler/l8tunnel-log-vnet:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 29010
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: hdata
              mountPath: /data
            - name: logs
              mountPath: /data/logs/l8tunnel
      volumes:
        - name: hdata
          persistentVolumeClaim:
            claimName: l8tunnel-data
        - name: logs
          hostPath:
            path: /var/log/l8tunnel
            type: DirectoryOrCreate

---

# Collects the shared log directory on its node for the logs network.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  namespace: l8tunnel
  name: l8tunnel-log-agent
  labels:
    app: l8tunnel-log-agent
spec:
  selector:
    matchLabels:
      app: l8tunnel-log-agent
  template:
    metadata:
      labels:
        app: l8tunnel-log-agent
    spec:
      hostNetwork: true
      containers:
        - name: l8tunnel-log-agent
          image: "saichler/l8tunnel-log-agent:latest"
          imagePullPolicy: IfNotPresent
          env:
            - name: LOGPATH
              value: /data/logs/l8tunnel
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: hdata
              mountPath: /data
            - name: logs
              mountPath: /data/logs/l8tunnel
      volumes:
        - name: hdata
          persistentVolumeClaim:
            claimName: l8tunnel-data
        - name: logs
          hostPath:
            path: /var/log/l8tunnel
            type: DirectoryOrCreate

---

# The management backend: ORM services on its embedded Postgres.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: l8tunnel
  name: l8tunnel
  labels:
    app: l8tunnel
spec:
  serviceName: l8tunnel
  replicas: 1
  selector:
    matchLabels:
      app: l8tunnel
  template:
    metadata:
      labels:
        app: l8tunnel
    spec:
      hostNetwork: true
      containers:
        - name: l8tunnel
          image: "saichler/l8tunnel:latest"
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: L8TUNNEL_CLUSTER_CONFIG
              value: /etc/l8tunnel/cluster/cluster.yaml
          volumeMounts:
            - name: hdata
              mountPath: /data
            - name: logs
              mountPath: /data/logs/l8tunnel
            - name: cluster
              mountPath: /etc/l8tunnel/cluster
              readOnly: true
            - name: agent-ca
              mountPath: /etc/l8tunnel/agent-ca
              readOnly: true
      volumes:
        - name: hdata
          persistentVolumeClaim:
            claimName: l8tunnel-data
        - name: logs
          hostPath:
            path: /var/log/l8tunnel
            type: DirectoryOrCreate
        - name: cluster
          configMap:
            name: l8tunnel-cluster
        - name: agent-ca
          secret:
            secretName: l8tunnel-agent-ca
            defaultMode: 256

---

# The web server: REST API, UI, and FileStore (exactly one instance).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  namespace: l8tunnel
  name: l8tunnel-web
  labels:
    app: l8tunnel-web
spec:
  selector:
    matchLabels:
      app: l8tunnel-web
  template:
    metadata:
      labels:
        app: l8tunnel-web
    spec:
      hostNetwork: true
      nodeSelector:
        l8tunnel.io/edge: "true"
      containers:
        - name: l8tunnel-web
          image: "saichler/l8tunnel-web:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5443
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: hdata
              mountPath: /data
            - name: logs
              mountPath: /data/logs/l8tunnel
      volumes:
        - name: hdata
          persistentVolumeClaim:
            claimName: l8tunnel-data
        - name: logs
          hostPath:
            path: /var/log/l8tunnel
            type: DirectoryOrCreate

---

# The registry: the single owner of the live tables (claims engine).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: l8tunnel
  name: l8tunnel-registry
  labels:
    app: l8tunnel-registry
spec:
  serviceName: l8tunnel-registry
  replicas: 1
  selector:
    matchLabels:
      app: l8tunnel-registry
  template:
    metadata:
      labels:
        app: l8tunnel-registry
    spec:
      hostNetwork: true
      containers:
        - name: l8tunnel-registry
          image: "saichler/l8tunnel-registry:latest"
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: L8TUNNEL_CLUSTER_CONFIG
              value: /etc/l8tunnel/cluster/cluster.yaml
          volumeMounts:
            - name: hdata
              mountPath: /data
            - name: logs
              mountPath: /data/logs/l8tunnel
            - name: cluster
              mountPath: /etc/l8tunnel/cluster
              readOnly: true
      volumes:
        - name: hdata
          persistentVolumeClaim:
            claimName: l8tunnel-data
        - name: logs
          hostPath:
            path: /var/log/l8tunnel
            type: DirectoryOrCreate
        - name: cluster
          configMap:
            name: l8tunnel-cluster

---

# The relays: agent sessions and tunnel traffic, on the pod network.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: l8tunnel
  name: l8tunnel-relay
  labels:
    app: l8tunnel-relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: l8tunnel-relay
  template:
    metadata:
      labels:
        app: l8tunnel-relay
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: l8tunnel-relay
          image: "saichler/l8tunnel-relay:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: tls
              containerPort: 8443
            - name: http
              containerPort: 8080
            - name: stream
              containerPort: 8444
            - name: gateway
              containerPort: 2222
            - name: ops
              containerPort: 9100
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: L8TUNNEL_CLUSTER_CONFIG
              value: /etc/l8tunnel/cluster/cluster.yaml
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9100
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9100
            periodSeconds: 10
          volumeMounts:
            - name: hdata
              mountPath: /data
            - name: logs
              mountPath: /data/logs/l8tunnel
            - name: cluster
              mountPath: /etc/l8tunnel/cluster
              readOnly: true
            - name: agent-ca
              mountPath: /etc/l8tunnel/agent-ca
              readOnly: true
            - name: cluster-secret
              mountPath: /etc/l8tunnel/cluster-secret
              readOnly: true
      volumes:
        - name: hdata
          persistentVolumeClaim:
            claimName: l8tunnel-data
        - name: logs
          hostPath:
            path: /var/log/l8tunnel
            type: DirectoryOrCreate
        - name: cluster
          configMap:
            name: l8tunnel-cluster
        - name: agent-ca
          secret:
            secretName: l8tunnel-agent-ca
            defaultMode: 256
        - name: cluster-secret
          secret:
            secretName: l8tunnel-cluster
            defaultMode: 256

---

# The relays' headless Service (stable pod names for the StatefulSet).
apiVersion: v1
kind: Service
metadata:
  namespace: l8tunnel
  name: l8tunnel-relay
  labels:
    app: l8tunnel-relay
spec:
  clusterIP: None
  selector:
    app: l8tunnel-relay
  ports:
    - name: tls
      port: 8443
    - name: http
      port: 8080
    - name: stream
      port: 8444
    - name: gateway
      port: 2222
    - name: ops
      port: 9100

---

# The relays' ports take traffic only from inside the cluster: the edge
# (host network, so from the node addresses) and the other relays. The
# public ports are the edge's.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: l8tunnel
  name: l8tunnel-relay-internal
spec:
  podSelector:
    matchLabels:
      app: l8tunnel-relay
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - port: 8443
          protocol: TCP
        - port: 8080
          protocol: TCP
        - port: 8444
          protocol: TCP
        - port: 2222
          protocol: TCP
        - port: 9100
          protocol: TCP

---

# The edge: the reverse proxy and load balancer the router forwards to. It
# uses the host network (it binds the public ports) on the node the router
# points at.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  namespace: l8tunnel
  name: l8tunnel-edge
  labels:
    app: l8tunnel-edge
spec:
  selector:
    matchLabels:
      app: l8tunnel-edge
  template:
    metadata:
      labels:
        app: l8tunnel-edge
    spec:
      hostNetwork: true
      nodeSelector:
        l8tunnel.io/edge: "true"
      containers:
        - name: l8tunnel-edge
          image: "saichler/l8tunnel-edge:latest"
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: L8TUNNEL_CLUSTER_CONFIG
              value: /etc/l8tunnel/cluster/cluster.yaml
          securityContext:
            capabilities:
              add:
                - NET_BIND_SERVICE
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9180
            periodSeconds: 10
          volumeMounts:
            - name: hdata
              mountPath: /data
            - name: logs
              mountPath: /data/logs/l8tunnel
            - name: cluster
              mountPath: /etc/l8tunnel/cluster
              readOnly: true
            - name: cluster-secret
              mountPath: /etc/l8tunnel/cluster-secret
              readOnly: true
      volumes:
        - name: hdata
          persistentVolumeClaim:
            claimName: l8tunnel-data
        - name: logs
          hostPath:
            path: /var/log/l8tunnel
            type: DirectoryOrCreate
        - name: cluster
          configMap:
            name: l8tunnel-cluster
        - name: cluster-secret
          secret:
            secretName: l8tunnel-cluster
            defaultMode: 256
