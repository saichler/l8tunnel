# /etc/l8tunnel/server.yaml: l8tunnel relay
#
# DNS at Porkbun:
#   *.layer8-tunnel.info          A  <this machine's public IP>   (tunnels and connect.layer8-tunnel.info)
#   layer8-tunnel.info, www       keep their existing records (explicit records win over the wildcard)
#
# Full reference: deploy/examples/server.yaml in the l8tunnel repository.

base_domain: layer8-tunnel.info
# control_sni: connect.layer8-tunnel.info     # default: agents connect here

# Names no tunnel may take (www.layer8-tunnel.info stays for a website).
reserved_names: [www]

listen:
  https: ":443"          # agents and every tunnel's HTTPS/TLS traffic
  http: ":80"            # redirects to HTTPS

tcp_port_range: "22000-22999"   # one public port per ssh/tcp tunnel (mode A)

# Installed by install-cert.sh (Porkbun bundle: domain.cert.pem / private.key.pem).
tls:
  cert: /etc/l8tunnel/tls/fullchain.pem
  key: /etc/l8tunnel/tls/privkey.pem

log:
  format: text           # or json
  level: info

# Optional:
# ssh_gateway: {listen: ":2222"}        # ssh -J gw@layer8-tunnel.info:2222 user@<tunnel>
# metrics: {listen: "127.0.0.1:9100"}   # Prometheus
# access_log: true                      # one line per HTTP tunnel request
